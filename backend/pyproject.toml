[project]
name = "controle-faltas"
version = "0.1.0"
description = "Controle de faltas em disciplinas do Inatel"
authors = [
    {name = "guumarques",email = "gustavo.gr697.gm@gmail.com"}
]
requires-python = ">=3.13"
dependencies = [
    "fastapi (>=0.165.0,<0.166.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "sqlalchemy (>=2.1.9,<3.0.0)",
    "psycopg[binary] (>=3.3.9,<4.0.0)",
    "alembic (>=1.20.1,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
extend-exclude = ["alembic/versions", "alembic/env.py"]

[tool.ruff.lint]
select = [
    "E",   
    "W",   
    "F",    
    "I",    
    "UP",   
    "B",   
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "ruff (>=0.17.5,<0.18.0)"
]
